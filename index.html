<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Text Counter</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #0f1419;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .wrap {
      width: 100%;
      max-width: 600px;
    }
    .composer {
      position: relative;
      width: 100%;
      min-height: 220px;
      border: 1px solid #cfd9de;
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
    }
    textarea {
      width: 100%;
      min-height: 220px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: #0f1419;
      padding: 18px 18px 48px;
      font: inherit;
      font-size: 20px;
      line-height: 1.45;
      display: block;
    }
    textarea::placeholder { color: #536471; }
    .count {
      position: absolute;
      right: 16px;
      bottom: 14px;
      font-size: 14px;
      color: #536471;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script>
    function updateCount(el) {
      var counter = document.getElementById('count');
      counter.textContent = Array.from(el.value).length;
      el.style.height = 'auto';
      el.style.height = Math.max(220, el.scrollHeight) + 'px';
    }
  </script>
</head>
<body>
  <main class="wrap">
    <div class="composer">
      <textarea id="text" aria-label="文字入力欄" placeholder="いまどうしてる？" oninput="updateCount(this)" autofocus></textarea>
      <div class="count" id="count">0</div>
    </div>
  </main>
</body>
</html>
